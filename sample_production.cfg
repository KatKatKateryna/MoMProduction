[general]
WORKING_DIR: ~/MoM/Processing
PRODUCT_DIR: ~/MoM/Products
# 2 scripts below require GITHUB_REPO and GITHUB_ALERTS_TOKEN env vars to run
# push the final alert csv files to GitHub after each job (run_mom_job.sh)
PUBLISH_CSV: False
# publish the tiles after each job (run_mom_job.sh)
PUBLISH_TILES: False
# area of interest: minlon, minlat, maxlon, maxlat (at most 5 decimals are
# kept); empty is the whole globe. With a box, WORKING_DIR and PRODUCT_DIR
# each get the suffix _minlon_minlat_maxlon_maxlat, e.g.
# ~/MoM/Processing -> ~/MoM/Processing_72_5_88_22
BBOX:

[processing_dir]
glofas: glofas
gfms: gfms
hwrf: hwrf
dfo: dfo
viirs: viirs
logs:logs

[products_dir]
GLOFAS: GLOFAS 
GFMS: GFMS
HWRF: HWRF
DFO: DFO
VIIRS: VIIRS
FINAL: Final_Alert  

[glofas]
HOST: aux.ecmwf.int
USER: ???
PASSWD: ???
DIRECTORY: /for_PDC

[gfms]
HOST: http://eagle2.umd.edu/flood/download/

[dfo]
HOST: https://nrt4.modaps.eosdis.nasa.gov/api/v2/content/archives/allData/61/MCDWD_L3_NRT/
TOKEN: ???

[viirs]
HOST: https://floodlight.ssec.wisc.edu/composite/

[hwrf]
#HOST: https://ftpprd.ncep.noaa.gov/data/nccf/com/hur/prod/
#HOST: https://ftpprd.ncep.noaa.gov/data/nccf/com/hwrf/prod/
HOST: https://nomads.ncep.noaa.gov/pub/data/nccf/com/hwrf/prod/

[hafs]
# HAFS hurricane rainfall, run as its own job (processing/MoM_run.py -j HAFS) into
# separate folders; it never changes the HWRF workflow outputs
# if enabled, the published alerts will be using it by default
ENABLED: False
# NOAA HAFS archive on AWS (keeps the full history)
HOST: https://noaa-nws-hafs-pds.s3.amazonaws.com/
MODEL: hfsa

[storage]
dfo_save: True
viirs_save: True
