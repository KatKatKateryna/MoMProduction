[general]
WORKING_DIR: ~/MoM/Processing
PRODUCT_DIR: ~/MoM/Products

[processing_dir]
glofas: glofas
gfms: gfms
hwrf: hwrf
dfo: dfo
viirs: viirs
logs:logs

[products_dir]
GLOFAS: GLOFAS 
GFMS: GFMS
HWRF: HWRF
DFO: DFO
VIIRS: VIIRS
FINAL: Final_Alert  

[glofas]
HOST: aux.ecmwf.int
USER: ???
PASSWD: ???
DIRECTORY: /for_PDC

[gfms]
HOST: http://eagle2.umd.edu/flood/download/

[dfo]
HOST: https://nrt4.modaps.eosdis.nasa.gov/api/v2/content/archives/allData/61/MCDWD_L3_NRT/
TOKEN: ???

[viirs]
HOST: https://floodlight.ssec.wisc.edu/composite/

[hwrf]
#HOST: https://ftpprd.ncep.noaa.gov/data/nccf/com/hur/prod/
#HOST: https://ftpprd.ncep.noaa.gov/data/nccf/com/hwrf/prod/
HOST: https://nomads.ncep.noaa.gov/pub/data/nccf/com/hwrf/prod/

[hafs]
# HAFS hurricane rainfall, run as its own job (MoM_run.py -j HAFS) into
# separate folders; it never changes the HWRF workflow outputs
ENABLED: True
# NOAA HAFS archive on AWS (keeps the full history)
HOST: https://noaa-nws-hafs-pds.s3.amazonaws.com/
MODEL: hfsa
# days the HAFS job looks back to catch up
LOOKBACK_DAYS: 2
# where the host-data backups (grb2 swaths + track files) are kept;
# absolute path keeps them off the root filesystem
# BACKUP_DIR: /mnt/your_volume/MoM/HAFS_host_data_backups

[storage]
dfo_save: True
viirs_save: True
